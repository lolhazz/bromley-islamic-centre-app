name: BromleyIslamicCentre
options:
  bundleIdPrefix: uk.org.bromleyislamiccentre
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BromleyIslamicCentre:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - target: BromleyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.org.bromleyislamiccentre.app
        PRODUCT_NAME: "Bromley IC"
        PRODUCT_MODULE_NAME: BromleyIslamicCentre
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bromley IC"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Bromley IC"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Newsreader-Regular.ttf
          - Newsreader-Medium.ttf
          - Newsreader-SemiBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
        NSLocationWhenInUseUsageDescription: "Used to point the Qibla compass towards Makkah and to refine prayer times for where you are."
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent

  BromleyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: Sources/PrayerTimes.swift
      - path: Sources/Ramadan.swift
      - path: Sources/EightPointStar.swift
      - path: Resources
        includes:
          - "*.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.org.bromleyislamiccentre.app.widgets
        PRODUCT_NAME: BromleyWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bromley IC Widgets"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Bromley IC Widgets"
        UIAppFonts:
          - Newsreader-SemiBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BromleyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Widgets/PrayerProvider.swift
      - path: Widgets/PrayerWidgetView.swift
    dependencies:
      - target: BromleyIslamicCentre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.org.bromleyislamiccentre.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bromley IC.app/Bromley IC"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

schemes:
  BromleyIslamicCentre:
    build:
      targets:
        BromleyIslamicCentre: all
    test:
      targets:
        - BromleyTests
